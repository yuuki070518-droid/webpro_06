<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新規登録</title>
</head>
<body>
  <h2>駅の新規登録</h2>
  <form action="/keiyo2" method="POST">
    <label for="code">駅コード:</label>
    <input type="text" id="code" name="code" required><br>
    <label for="name">駅名:</label>
    <input type="text" id="name" name="name" required><br>
    <label for="change">乗り換え線:</label>
    <input type="text" id="change" name="change"><br>
    <label for="passengers">乗車人員:</label>
    <input type="number" id="passengers" name="passengers" required><br>
    <label for="distance">東京駅からの距離:</label>
    <input type="number" step="0.1" id="distance" name="distance" required><br>
    <input type="submit" value="登録">
  </form>
  <p><a href="/keiyo2">駅一覧に戻る</a></p>
</body>
</html>
